name: CI

on:
  push:
  pull_request:

jobs:
  check-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run artifact check
        run: python scripts/check_artifact.py

      - name: Build Docker image
        run: docker build -t shipit .